name: Deploy La Norma preview to GitHub Pages

on:
  push:
    branches: [redesign-visual-16-09]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar pasta pública (só o site, sem docs internos)
        run: |
          set -e
          mkdir -p _site/css
          cp index.html nosotros.html productos.html _site/
          cp css/style.css _site/css/
          cp -r assets/real _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
